name: iOS Trial Build — Camera Preview Fix Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable verbose Xcode output'
        required: false
        default: 'false'

jobs:
  verify-ios-build:
    name: Build iOS (cordova-ios 8 + Bobbsskuyy fork)
    runs-on: macos-latest

    steps:
      # ───────────────────────────────────────────────────────────
      # STEP 1: Checkout
      # ───────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────────────────
      # STEP 2: Setup Node 20 (minimum untuk cordova-ios 8)
      # ───────────────────────────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ───────────────────────────────────────────────────────────
      # STEP 3: Print environment info
      # ───────────────────────────────────────────────────────────
      - name: 🖥️ Environment info
        run: |
          echo "──────────────────────────────────"
          echo "Node:    $(node --version)"
          echo "npm:     $(npm --version)"
          echo "Xcode:   $(xcodebuild -version | tr '\n' ' ')"
          echo "macOS:   $(sw_vers -productVersion)"
          echo "──────────────────────────────────"

      # ───────────────────────────────────────────────────────────
      # STEP 4: Install Cordova CLI
      # ───────────────────────────────────────────────────────────
      - name: 📦 Install Cordova CLI
        run: |
          npm install -g cordova@latest
          echo "Cordova: $(cordova --version)"

      # ───────────────────────────────────────────────────────────
      # STEP 5: Install project dependencies
      # ───────────────────────────────────────────────────────────
      - name: 📦 npm install
        run: npm install

      # ───────────────────────────────────────────────────────────
      # STEP 6: Add cordova-ios 8 platform
      # ───────────────────────────────────────────────────────────
      - name: 📱 Add cordova-ios@8 platform
        run: |
          cordova platform add ios@8
          echo ""
          echo "=== Platforms installed ==="
          cordova platform list

      # ───────────────────────────────────────────────────────────
      # STEP 7: Verify fork plugin ter-install dengan benar
      # ───────────────────────────────────────────────────────────
      - name: 🔍 Verify fork plugin installed
        run: |
          echo "=== Installed plugins ==="
          cordova plugin list
          echo ""

          PLUGIN_DIR="plugins/cordova-plugin-camera-preview"

          # Cek plugin ada
          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "❌ Plugin directory not found: $PLUGIN_DIR"
            exit 1
          fi
          echo "✅ Plugin directory found"

          # Cek berasal dari fork Bobbsskuyy
          if grep -q "Bobbsskuyy" "$PLUGIN_DIR/package.json" 2>/dev/null || \
             grep -q "Bobbsskuyy" "package.json"; then
            echo "✅ Plugin sourced from Bobbsskuyy fork"
          else
            echo "⚠️  Could not confirm fork source — checking plugin.xml..."
            cat "$PLUGIN_DIR/plugin.xml" | grep -i "repo\|url" || true
          fi

          # Cek file iOS ada
          if [ ! -f "$PLUGIN_DIR/src/ios/CameraPreview.m" ]; then
            echo "❌ CameraPreview.m not found"
            exit 1
          fi
          echo "✅ CameraPreview.m found"

      # ───────────────────────────────────────────────────────────
      # STEP 8: Static check — verifikasi semua fix ada di source
      # ───────────────────────────────────────────────────────────
      - name: 🔬 Static check — verify all fixes applied
        run: |
          FILE="plugins/cordova-plugin-camera-preview/src/ios/CameraPreview.m"
          PLUGIN_XML="plugins/cordova-plugin-camera-preview/plugin.xml"
          FAILED=0

          echo "════════════════════════════════════════"
          echo "  Checking fixes in CameraPreview.m"
          echo "════════════════════════════════════════"

          echo ""
          echo "── FIX #1: Unified import ──"
          if grep -q '#import <Cordova/Cordova.h>' "$FILE"; then
            echo "✅ Unified import <Cordova/Cordova.h> found"
          else
            echo "⚠️  Still using old-style imports (non-fatal, may still compile)"
          fi

          echo ""
          echo "── FIX #2: _activeRootView helper ──"
          if grep -q '_activeRootView' "$FILE"; then
            echo "✅ _activeRootView helper found"
          else
            echo "❌ _activeRootView NOT found — view hierarchy fix MISSING"
            FAILED=1
          fi

          echo ""
          echo "── FIX #3a: didMoveToParentViewController ──"
          if grep -q 'didMoveToParentViewController' "$FILE"; then
            echo "✅ didMoveToParentViewController found"
          else
            echo "❌ didMoveToParentViewController NOT found"
            FAILED=1
          fi

          echo ""
          echo "── FIX #3b: willMoveToParentViewController:nil ──"
          if grep -q 'willMoveToParentViewController:nil' "$FILE"; then
            echo "✅ willMoveToParentViewController:nil found"
          else
            echo "❌ willMoveToParentViewController:nil NOT found"
            FAILED=1
          fi

          echo ""
          echo "── FIX #5: plugin.xml <engines> ──"
          if grep -q '<engines>' "$PLUGIN_XML"; then
            echo "✅ <engines> declaration found"
            grep -A5 '<engines>' "$PLUGIN_XML"
          else
            echo "❌ <engines> declaration MISSING in plugin.xml"
            FAILED=1
          fi

          echo ""
          echo "════════════════════════════════════════"
          if [ $FAILED -eq 0 ]; then
            echo "✅ ALL FIXES VERIFIED"
          else
            echo "❌ SOME FIXES ARE MISSING — check output above"
            exit 1
          fi
          echo "════════════════════════════════════════"

      # ───────────────────────────────────────────────────────────
      # STEP 9: Build iOS (simulator, no code signing)
      # ───────────────────────────────────────────────────────────
      - name: 🔨 Build iOS (simulator — no signing)
        run: |
          if [ "${{ github.event.inputs.debug_mode }}" = "true" ]; then
            cordova build ios \
              --emulator \
              --verbose \
              -- \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            cordova build ios \
              --emulator \
              -- \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi
        timeout-minutes: 20

      # ───────────────────────────────────────────────────────────
      # STEP 10: Verify .app build artifact
      # ───────────────────────────────────────────────────────────
      - name: ✅ Verify build artifact
        run: |
          echo "=== Searching for .app artifact ==="
          find platforms/ios/build -name "*.app" 2>/dev/null

          APP_PATH=$(find platforms/ios/build -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app artifact found — build may have failed silently"
            exit 1
          fi

          echo ""
          echo "✅ Build artifact found: $APP_PATH"
          echo "   Size: $(du -sh "$APP_PATH" | cut -f1)"

      # ───────────────────────────────────────────────────────────
      # STEP 11: Upload artifacts
      # ───────────────────────────────────────────────────────────
      - name: 📤 Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-camera-preview-build-${{ github.run_number }}
          path: platforms/ios/build/**/*.app
          retention-days: 7
          if-no-files-found: warn

      # ───────────────────────────────────────────────────────────
      # STEP 12: Job summary
      # ───────────────────────────────────────────────────────────
      - name: 📋 Job summary
        if: always()
        run: |
          echo "## 📱 iOS Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Plugin source | \`Bobbsskuyy/cordova-plugin-camera-preview\` |" >> $GITHUB_STEP_SUMMARY
          echo "| cordova-ios | \`$(cordova platform list | grep ios | head -1)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | \`$(xcodebuild -version | head -1)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Node | \`$(node --version)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          APP_PATH=$(find platforms/ios/build -name "*.app" 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "### ✅ Build SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "Artifact: \`$APP_PATH\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build FAILED" >> $GITHUB_STEP_SUMMARY
            echo "Check logs above for Xcode errors." >> $GITHUB_STEP_SUMMARY
          fi
